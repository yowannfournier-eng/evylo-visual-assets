<!doctype html><html lang="fr-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EVYLO | Market Pulse — 41 actifs</title><style>body{margin:0;background:#03101e;color:#fff;font:14px Arial,sans-serif}.wrap{max-width:950px;margin:auto}.head{padding:22px;border-bottom:2px solid #bb9556;color:#ebc779}.head b{font:44px Georgia,serif;letter-spacing:6px}.head p{letter-spacing:2px;text-transform:uppercase}.notice{color:#e2cfa5;padding:17px;background:#172b3a;border-left:4px solid #c5a464;margin:20px}.grid{padding:18px;display:grid;gap:10px;grid-template-columns:repeat(4,minmax(0,1fr))}.card{border:1px solid #977d4c;background:#11283a;min-width:0}.card img{width:100%;height:145px;object-fit:cover;background:#1d3346}.card p{padding:8px;margin:0;font-size:12px}.status{color:#adbdcb;font-size:10px!important}.title{color:#e8c777;margin:18px;padding:6px;border-bottom:1px solid #bb9556}@media(max-width:550px){.grid{grid-template-columns:repeat(2,1fr)}.head b{font-size:30px}}</style></head><body><div class="wrap"><div class="head"><b>EVYLO</b><p>Bibliothèque Market Pulse</p></div><div class="notice" id="notice">Prévisualisation en cours de publication. Vérification HTTPS en attente.</div><h2 class="title">41 actifs identifiés</h2><div class="grid" id="grid"></div></div><script>fetch('/market-pulse/registry.json').then(r=>r.json()).then(d=>{let count=0;for(const a of d.assets){const c=document.createElement('div');c.className='card';const im=new Image();im.alt=a.label;im.loading='lazy';im.src=a.src;const status=document.createElement('p');status.className='status';status.textContent='En attente du fichier';im.onload=()=>{count++;status.textContent='Image chargée';if(count===41)document.getElementById('notice').textContent='41 fichiers accessibles — vérifier les URL HTTPS et le rendu Gmail avant validation.'};im.onerror=()=>{im.style.display='none';status.textContent='Fichier pas encore publié'};const p=document.createElement('p');p.textContent=a.label;c.append(im,p,status);document.getElementById('grid').append(c)}}).catch(e=>document.getElementById('notice').textContent='Registre non disponible');</script></body></html>
